<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Vue cartographique — page en préparation.">
<title>Vue d’ensemble — cartographie</title>
<style>
:root{color-scheme:light;--bg:#eef1f5;--paper:#fff;--ink:#182334;--muted:#617087;--line:#d9e0e9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.48 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 12px #1722360d}
.site-title{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand{font-weight:800;letter-spacing:.1em}
.page-switch{color:var(--muted);font-size:.92rem;text-decoration:none;font-weight:600;white-space:nowrap}
.page-switch:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.page-switch:focus-visible{outline:3px solid #7e9fe4;outline-offset:2px;border-radius:4px}
main{min-height:calc(100dvh - 54px)}
@media(max-width:720px){header{padding:7px 9px;gap:8px}.brand{font-size:.78rem}.site-title{gap:5px}.page-switch{font-size:.72rem}}
</style>
</head>
<body>
<header>
  <div class="site-title"><span class="brand">VUE D’ENSEMBLE</span> <a class="page-switch" href="./" title="Revenir à la frise chronologique">Cartographie</a></div>
</header>
<main aria-label="Cartographie"></main>
</body>
</html>
