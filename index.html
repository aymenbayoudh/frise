<html lang="fr">
<head>

<title>Chronique — frise historique</title>
<style>
:root{color-scheme:light;--bg:#eef1f5;--paper:#fff;--ink:#182334;--muted:#617087;--line:#d9e0e9;--accent:#315eb6;--shadow:0 18px 55px #1d2a3b24}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.48 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button,input,select,textarea,[contenteditable]{border:1px solid var(--line);border-radius:9px;background:#fff}button{min-height:40px;padding:8px 13px;cursor:pointer;font-weight:650}button:hover{background:#f1f5fa}button.primary,.active{color:#fff;background:var(--ink);border-color:var(--ink)}button.danger{color:#a3253a}button:focus-visible,input:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:3px solid #7e9fe4;outline-offset:2px}[hidden]{display:none!important}.file-button{display:inline-flex;align-items:center;min-height:40px;padding:8px 13px;cursor:pointer;font-weight:650;border:1px solid var(--line);border-radius:9px;background:#fff}.file-button:hover{background:#f1f5fa}.file-button input{display:none}
header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.14em}.header-actions,.toolbar,.filters,.actions,.richbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.subtle{color:var(--muted)}.small{font-size:.875rem}
main{padding:16px}.toolbar-shell{position:sticky;top:0;z-index:12;margin:-16px -16px 14px;padding:12px 16px;background:#eef1f5e8;backdrop-filter:blur(12px);border-bottom:1px solid #d9e0e980}.toolbar label{display:flex;align-items:center;gap:7px}.toolbar select{min-height:40px;padding:7px 30px 7px 9px}.filters{margin-top:10px}.filters button{min-height:34px;padding:5px 11px;border-radius:999px;font-size:.875rem}.filters .filter-label{font-size:.875rem;color:var(--muted);margin-right:2px}#toggleFilters[aria-expanded="true"] .chevron{transform:rotate(180deg)}.chevron{display:inline-block;transition:transform .15s}
#notice{margin:8px 2px;color:var(--muted);min-height:1.4em}#workspace{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}#viewport{overflow:auto;max-height:calc(100vh - 190px);min-height:430px;overscroll-behavior:contain}#canvas{position:relative;isolation:isolate;min-height:430px;background-image:linear-gradient(#f5f7fa 1px,transparent 1px);background-size:100% 44px}#canvas svg{position:absolute;inset:0;pointer-events:none;z-index:0}
.event{position:absolute;z-index:2;text-align:left;width:176px;min-height:0;padding:7px 9px;background:#fff;border:1px solid #dfe5ed;border-left:3px solid var(--event-color);border-radius:8px;box-shadow:0 3px 10px #1e293b10;overflow-wrap:anywhere;transition:transform .15s,box-shadow .15s,background .15s,opacity .15s}.event:hover,.event:focus-visible,.event.selected{z-index:4;background:#f8fbff;box-shadow:0 8px 22px #1e293b22;transform:translateY(-2px)}.event .card-date{display:block;color:var(--event-color);font-size:.75rem;font-weight:750;margin-bottom:2px}.event strong{display:block;font-size:.875rem;line-height:1.22}.event .subtitle{display:block;color:var(--muted);font-size:.78rem;line-height:1.22;margin-top:3px}.tick,.axis-event-date{position:absolute;z-index:1;padding:1px 5px;background:#fff;border-radius:4px;font-size:.78rem;white-space:nowrap;color:#425168;transform:translate(-50%,-50%)}.axis-event-date{color:var(--date-color);font-weight:750;border:1px solid color-mix(in srgb,var(--date-color) 28%,white);box-shadow:0 1px 3px #1e293b12}
.legend{display:flex;gap:18px;flex-wrap:wrap;padding:11px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}.empty{display:grid;place-items:center;height:180px;color:var(--muted)}
.zoom-controls{position:fixed;right:18px;bottom:18px;z-index:20;display:flex;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 8px 28px #1e293b22}.zoom-controls button{width:48px;height:46px;min-height:46px;padding:0;border:0;border-radius:0;font-size:1.55rem;line-height:1}.zoom-controls button+button{border-left:1px solid var(--line)}
#detail{position:fixed;z-index:30;width:min(440px,calc(100vw - 24px));max-height:min(72vh,680px);overflow:auto;padding:18px 18px 18px 22px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--event-color,var(--accent));border-radius:12px;box-shadow:var(--shadow);overscroll-behavior:contain}#detail .close{position:sticky;top:0;float:left;margin:0 10px 4px -12px;width:34px;min-height:34px;padding:0;border-radius:50%;background:#fff;z-index:2;font-size:1.25rem;line-height:1}#detail .detail-actions{display:flex;justify-content:flex-end;gap:8px}#detail h2{clear:both;margin:12px 0 4px;font-size:1.25rem;line-height:1.25}#detailDate{margin:0 0 10px;font-weight:700;color:var(--event-color,var(--accent))}#detailSubtitle{margin:0 0 12px;color:var(--muted)}#detailBody{overflow-wrap:anywhere}#detailBody img,#description img{display:block;max-width:100%;height:auto;max-height:340px;margin:10px 0;border-radius:8px}#detailTags{margin:14px 0 0;color:var(--muted)}
#tableView{overflow:auto;max-height:calc(100vh - 190px)}table{width:100%;border-collapse:collapse}th,td{text-align:left;vertical-align:top;padding:12px 10px;border-bottom:1px solid var(--line)}th{position:sticky;top:0;background:#fff;color:var(--muted);font-size:.82rem;z-index:2}td:first-child{min-width:230px}td{min-width:130px}
.scrim{position:fixed;inset:0;z-index:39;background:#17223658;backdrop-filter:blur(2px)}#editor{position:fixed;z-index:40;top:0;right:0;width:min(650px,100vw);height:100dvh;overflow:auto;margin:0;padding:22px;background:#fff;border:0;border-radius:16px 0 0 16px;box-shadow:-20px 0 70px #17223636}#editor h2{margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid>label,.field{display:flex;flex-direction:column;align-items:stretch;gap:6px;font-size:.9rem;font-weight:650}.form-grid input,.form-grid select{width:100%;min-height:42px;padding:9px}.full{grid-column:1/-1}.checks{display:flex;gap:18px;flex-wrap:wrap}.checks label{display:flex;align-items:center;gap:7px;font-size:.9rem}.checks input{width:18px;height:18px}.help{margin:0;padding:10px 12px;border-radius:8px;background:#f1f5fa;color:var(--muted);font-size:.84rem;font-weight:400}.richbar button{min-height:34px;padding:5px 9px;font-size:.84rem}#description{min-height:155px;padding:12px;overflow-wrap:anywhere;font-weight:400}#error{min-height:1.4em;color:#ad233b}.editor-actions{position:sticky;bottom:-22px;margin:20px -22px -22px;padding:13px 22px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.editor-actions>div{display:flex;gap:8px}
.color-line{display:grid;grid-template-columns:54px 1fr auto;gap:8px;align-items:center}.color-chip{width:54px;height:42px;border:1px solid var(--line);border-radius:9px;background:var(--chosen,#315eb6)}#colorCode{text-transform:uppercase}.color-pop{position:relative}.color-panel{position:absolute;right:0;top:48px;z-index:50;width:min(360px,calc(100vw - 42px));padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}#colorWheel{display:block;width:min(300px,100%);height:auto;aspect-ratio:1;margin:auto;touch-action:none;cursor:crosshair}.brightness{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-top:10px}.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:10px}.swatches button{min-height:32px;padding:0;background:var(--swatch);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
@media(max-width:720px){header{padding:12px 14px}.brand+span{display:none}main{padding:8px}.toolbar-shell{margin:-8px -8px 10px;padding:9px 8px}.toolbar{gap:7px}.toolbar label{font-size:.82rem}.toolbar .desktop-label{display:none}#viewport{max-height:calc(100dvh - 180px)}#detail{left:12px!important;right:auto!important;bottom:12px!important;top:auto!important;max-height:62dvh}.form-grid{grid-template-columns:1fr}#editor{border-radius:0;padding:16px}.editor-actions{bottom:-16px;margin:18px -16px -16px;padding:11px 16px}.header-actions .reset-text{display:none}}
@media(hover:none){.event:hover{transform:none}}
</style>
</head>
<body>
<header>
  <div><span class="brand">CHRONIQUE</span> <span class="subtle">Frise historique</span></div>
  <div class="header-actions"><label class="file-button">Importer CSV<input id="importCsv" type="file" accept=".csv,text/csv"></label><button id="exportCsv">Exporter CSV</button><button id="add" class="primary">+ Nouvel événement</button></div>
</header>
<main>
  <div class="toolbar-shell">
    <div class="toolbar">
      <button id="timelineButton" class="active">Frise</button><button id="tableButton">Tableau</button>
      <label><span class="desktop-label">Direction</span><select id="direction" aria-label="Direction"><option value="lr">Gauche → droite</option><option value="rl">Droite → gauche</option><option value="tb">Haut → bas</option><option value="bt">Bas → haut</option></select></label>
      <button id="toggleFilters" type="button" aria-expanded="false">Étiquettes <span class="chevron" aria-hidden="true">⌄</span></button>
    </div>
    <div id="filters" class="filters" aria-label="Filtres par étiquette" hidden></div>
  </div>
  <p id="notice" role="status"></p>
  <section id="workspace">
    <div id="viewport"><div id="canvas"></div></div>
    <div id="tableView" hidden></div>
    <div class="legend"><span>● date précise</span><span>◌ date approximative</span><span>▨ durée hachurée</span><span id="count"></span></div>
  </section>
</main>
<div class="zoom-controls" aria-label="Zoom de la frise"><button id="zoomOut" type="button" aria-label="Dézoomer">−</button><button id="zoomIn" type="button" aria-label="Zoomer">+</button></div>

<aside id="detail" hidden aria-label="Informations complémentaires">
  <button id="closeDetail" class="close" aria-label="Fermer la fiche">×</button>
  <div class="detail-actions"><button id="modifyDetail">Modifier</button></div>
  <h2 id="detailTitle"></h2><p id="detailDate"></p><p id="detailSubtitle"></p>
  <div id="detailBody"></div><p id="detailTags" class="small"></p>
</aside>

<div id="scrim" class="scrim" hidden></div>
<form id="editor" hidden>
  <h2 id="formTitle">Nouvel événement</h2>
  <div class="form-grid">
    <label>Nom complet<input id="name" required maxlength="240"></label>
    <label>Sous-titre<input id="subtitle" maxlength="300"></label>
    <label>Type<select id="kind"><option value="point">Événement ponctuel</option><option value="period">Période / durée</option></select></label>
    <label>Date ou début<input id="start" required placeholder="7/12/1637, 1637, XIXe siècle"></label>
    <label id="endLabel">Fin de la période<input id="end" placeholder="1639 ou XIXe siècle"></label>
    <label>Étiquettes<input id="tags" placeholder="urbanisme, lois, culture"></label>
    <div class="full field">Couleur
      <div class="color-line"><span id="colorChip" class="color-chip" aria-hidden="true"></span><input id="colorCode" value="#315EB6" maxlength="7" aria-label="Code couleur hexadécimal"><div class="color-pop"><button id="openColor" type="button">Grande roue</button><div id="colorPanel" class="color-panel" hidden><canvas id="colorWheel" width="600" height="600" aria-label="Roue chromatique"></canvas><label class="brightness">Luminosité <input id="brightness" type="range" min="18" max="92" value="45"></label><div id="swatches" class="swatches"></div></div></div></div>
    </div>
    <div id="periodOptions" class="full checks"><label><input id="includeStart" type="checkbox" checked>Borne initiale incluse</label><label><input id="includeEnd" type="checkbox" checked>Borne finale incluse</label></div>
    <p class="full help">Une année saisie comme événement ponctuel reste une date approximative. Pour une année entière, choisissez « Période » et laissez la fin vide.</p>
    <div class="full field">Description — visible uniquement dans la fiche
      <div class="richbar"><button type="button" data-command="bold"><b>Gras</b></button><button type="button" data-command="italic"><i>Italique</i></button><button type="button" data-command="insertUnorderedList">Liste</button><button type="button" id="link">Lien</button><label class="small">Image <input id="image" type="file" accept="image/png,image/jpeg,image/webp"></label></div>
      <div id="description" contenteditable="true" role="textbox" aria-label="Description enrichie" aria-multiline="true"></div>
    </div>
  </div>
  <p id="error" role="alert"></p>
  <div class="editor-actions"><button type="button" id="delete" class="danger">Supprimer</button><div><button type="button" id="cancel">Annuler</button><button type="submit" class="primary">Enregistrer</button></div></div>
</form>

 {"id":2,"name":"Règne de Louis XIV","subtitle":"France","kind":"period","start":"14/5/1643","end":"1/9/1715","includeStart":true,"includeEnd":true,"tags":["histoire de France"],"color":"#315EB6","html":"<p>Le règne commence sous la régence d’Anne d’Autriche, avec Mazarin. Le gouvernement personnel commence en 1661.</p>"},
 {"id":3,"name":"Régence d’Anne d’Autriche","subtitle":"Minorité du roi","kind":"period","start":"1643","end":"1651","includeStart":true,"includeEnd":true,"tags":["histoire de France"],"color":"#C94F59","html":"<p>La régence s’achève à la majorité du roi en 1651. Mazarin demeure au pouvoir jusqu’en 1661.</p>"},
 {"id":4,"name":"Fronde","subtitle":"Troubles politiques et guerre civile","kind":"period","start":"1648","end":"1653","includeStart":true,"includeEnd":true,"tags":["histoire de France"],"color":"#D8792D","html":"<p>La Fronde se déroule au début du règne de Louis XIV.</p>"},
 {"id":5,"name":"Commonwealth d’Angleterre","subtitle":"Repère britannique","kind":"period","start":"1649","end":"1660","includeStart":true,"includeEnd":true,"tags":["Europe"],"color":"#14847A","html":"<p>Repère large comprenant le Protectorat de 1653 à 1659.</p>"},
 {"id":6,"name":"Crise du jansénisme","subtitle":"Jalon à préciser","kind":"point","start":"1657","end":"","includeStart":true,"includeEnd":true,"tags":["religion"],"color":"#8A55A7","html":"<p>Jalon repris du texte initial. Préciser l’épisode et sa source avant de l’utiliser comme référence.</p>"},
 {"id":7,"name":"Début du règne personnel","subtitle":"Louis XIV","kind":"point","start":"1661","end":"","includeStart":true,"includeEnd":true,"tags":["histoire de France"],"color":"#315EB6","html":"<p>Après la mort de Mazarin, Louis XIV gouverne sans principal ministre.</p>"},
 {"id":8,"name":"Manufacture de Beauvais","subtitle":"Tapisserie","kind":"point","start":"1664","end":"","includeStart":true,"includeEnd":true,"tags":["culture","économie"],"color":"#14847A","html":"<p>Création de la manufacture de Beauvais.</p>"},
 {"id":9,"name":"Manufacture royale des glaces","subtitle":"Future Saint-Gobain","kind":"point","start":"1665","end":"","includeStart":true,"includeEnd":true,"tags":["économie"],"color":"#14847A","html":"<p>Fondation de la manufacture royale des glaces de miroirs.</p>"},
 {"id":10,"name":"Ordonnance sur le commerce","subtitle":"Commerce de terre","kind":"point","start":"1673","end":"","includeStart":true,"includeEnd":true,"tags":["lois","économie"],"color":"#8A55A7","html":"<p>L’ordonnance de 1673 est un antécédent du Code de commerce de 1807.</p>"},
 {"id":11,"name":"Édit de Saint-Germain-en-Laye","subtitle":"Enseignement du droit français","kind":"point","start":"1679","end":"","includeStart":true,"includeEnd":true,"tags":["lois","éducation"],"color":"#8A55A7","html":"<p>Organisation de l’enseignement du droit français dans les universités du royaume.</p>"},
 {"id":12,"name":"Révocation de l’édit de Nantes","subtitle":"Édit de Fontainebleau","kind":"point","start":"1685","end":"","includeStart":true,"includeEnd":true,"tags":["lois","religion"],"color":"#C94F59","html":"<p>Révocation de l’édit de Nantes sous Louis XIV.</p>"},

 {"id":13,"name":"Acte I de la décentralisation","subtitle":"Lois Defferre et transferts de compétences","kind":"period","start":"2/3/1982","end":"16/3/1986","includeStart":true,"includeEnd":true,"tags":["décentralisation","période"],"color":"#82A9C7","html":"<p>Première grande vague de décentralisation : suppression de la tutelle administrative a priori, exécutif départemental confié au président du conseil général, régions érigées en collectivités territoriales et transferts de compétences.</p><p><a href=\"https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20grandes%20%C3%A9tapes%20de%20la%20d%C3%A9centralisation/\">Source : WikiTerritorial du CNFPT</a></p>"},
 {"id":14,"name":"Loi Defferre relative aux droits et libertés","subtitle":"Communes, départements et régions","kind":"point","start":"2/3/1982","end":"","includeStart":true,"includeEnd":true,"tags":["décentralisation","loi"],"color":"#A98CC2","html":"<p>Loi n° 82-213 : acte fondateur de la décentralisation contemporaine, elle remplace notamment la tutelle préfectorale a priori par un contrôle de légalité a posteriori.</p><p><a href=\"https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20grandes%20%C3%A9tapes%20de%20la%20d%C3%A9centralisation/\">Source : WikiTerritorial du CNFPT</a></p>"},
 {"id":15,"name":"Première loi de répartition des compétences","subtitle":"Premier volet des transferts","kind":"point","start":"7/1/1983","end":"","includeStart":true,"includeEnd":true,"tags":["décentralisation","loi"],"color":"#A98CC2","html":"<p>Loi n° 83-8 relative à la répartition de compétences entre les communes, les départements, les régions et l’État.</p><p><a href=\"https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20grandes%20%C3%A9tapes%20de%20la%20d%C3%A9centralisation/\">Source : WikiTerritorial du CNFPT</a></p>"},
 {"id":16,"name":"Seconde loi de répartition des compétences","subtitle":"Complément des transferts","kind":"point","start":"22/7/1983","end":"","includeStart":true,"includeEnd":true,"tags":["décentralisation","loi"],"color":"#A98CC2","html":"<p>Loi n° 83-663 complétant celle du 7 janvier 1983, notamment en matière d’enseignement, d’urbanisme, d’action sociale et de transports.</p><p><a href=\"https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20grandes%20%C3%A9tapes%20de%20la%20d%C3%A9centralisation/\">Source : WikiTerritorial du CNFPT</a></p>"},
 {"id":17,"name":"Statut de la fonction publique territoriale","subtitle":"Titre III du statut général","kind":"point","start":"26/1/1984","end":"","includeStart":true,"includeEnd":true,"tags":["décentralisation","loi","fonction publique"],"color":"#A98CC2","html":"<p>Loi n° 84-53 portant dispositions statutaires relatives à la fonction publique territoriale.</p><p><a href=\"https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20grandes%20%C3%A9tapes%20de%20la%20d%C3%A9centralisation/\">Source : WikiTerritorial du CNFPT</a></p>"},
 {"id":18,"name":"Loi ATR","subtitle":"Administration territoriale de la République","kind":"point","start":"6/2/1992","end":"","includeStart":true,"includeEnd":true,"tags":["décentralisation","loi","intercommunalité"],"color":"#A98CC2","html":"<p>La loi ATR relance la coopération intercommunale et crée notamment les communautés de communes et de villes.</p><p><a href=\"https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20grandes%20%C3%A9tapes%20de%20la%20d%C3%A9centralisation/\">Source : WikiTerritorial du CNFPT</a></p>"},
 {"id":19,"name":"Loi Chevènement","subtitle":"Renforcement et simplification de l’intercommunalité","kind":"point","start":"12/7/1999","end":"","includeStart":true,"includeEnd":true,"tags":["décentralisation","loi","intercommunalité"],"color":"#A98CC2","html":"<p>La loi n° 99-586 structure l’intercommunalité à fiscalité propre autour des communautés de communes, d’agglomération et urbaines.</p><p><a href=\"https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20grandes%20%C3%A9tapes%20de%20la%20d%C3%A9centralisation/\">Source : WikiTerritorial du CNFPT</a></p>"},
 {"id":20,"name":"Acte II de la décentralisation","subtitle":"Révision constitutionnelle et nouveaux transferts","kind":"period","start":"28/3/2003","end":"13/8/2004","includeStart":true,"includeEnd":true,"tags":["décentralisation","période"],"color":"#82A9C7","html":"<p>La Constitution affirme l’organisation décentralisée de la République ; la loi de 2004 organise une nouvelle vague de transferts et d’expérimentations.</p><p><a href=\"https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20grandes%20%C3%A9tapes%20de%20la%20d%C3%A9centralisation/\">Source : WikiTerritorial du CNFPT</a></p>"},
 {"id":21,"name":"Révision constitutionnelle sur l’organisation décentralisée","subtitle":"Article 1er et titre XII de la Constitution","kind":"point","start":"28/3/2003","end":"","includeStart":true,"includeEnd":true,"tags":["décentralisation","loi constitutionnelle"],"color":"#A98CC2","html":"<p>La loi constitutionnelle n° 2003-276 consacre l’organisation décentralisée de la République, l’expérimentation, l’autonomie financière et le référendum local.</p><p><a href=\"https://www.vie-publique.fr/eclairage/38441-lacte-ii-de-la-decentralisation-la-revision-constitutionnelle\">Source : Vie-publique</a></p>"},
 {"id":22,"name":"Loi organique relative à l’expérimentation locale","subtitle":"Mise en œuvre de l’article 72","kind":"point","start":"1/8/2003","end":"","includeStart":true,"includeEnd":true,"tags":["décentralisation","loi organique"],"color":"#A98CC2","html":"<p>La loi organique n° 2003-704 précise les conditions dans lesquelles les collectivités peuvent expérimenter des dérogations législatives ou réglementaires.</p><p><a href=\"https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20grandes%20%C3%A9tapes%20de%20la%20d%C3%A9centralisation/\">Source : WikiTerritorial du CNFPT</a></p>"},
 {"id":23,"name":"Loi relative aux libertés et responsabilités locales","subtitle":"Transferts de l’acte II","kind":"point","start":"13/8/2004","end":"","includeStart":true,"includeEnd":true,"tags":["décentralisation","loi"],"color":"#A98CC2","html":"<p>La loi n° 2004-809 transfère ou précise de nombreuses compétences, notamment en matière de routes, d’action sociale, d’éducation et de développement économique.</p><p><a href=\"https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20grandes%20%C3%A9tapes%20de%20la%20d%C3%A9centralisation/\">Source : WikiTerritorial du CNFPT</a></p>"},
 {"id":24,"name":"Réforme des collectivités territoriales","subtitle":"Conseiller territorial et métropoles","kind":"point","start":"16/12/2010","end":"","includeStart":true,"includeEnd":true,"tags":["décentralisation","loi"],"color":"#A98CC2","html":"<p>La loi n° 2010-1563 réforme l’intercommunalité et crée le statut de métropole ; le conseiller territorial qu’elle prévoyait sera ensuite abandonné.</p><p><a href=\"https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20grandes%20%C3%A9tapes%20de%20la%20d%C3%A9centralisation/\">Source : WikiTerritorial du CNFPT</a></p>"},
 {"id":25,"name":"Acte III de la décentralisation","subtitle":"MAPTAM, nouvelles régions et NOTRe","kind":"period","start":"27/1/2014","end":"7/8/2015","includeStart":true,"includeEnd":true,"tags":["décentralisation","période"],"color":"#82A9C7","html":"<p>Trois lois recomposent l’action territoriale : affirmation des métropoles, nouvelle carte régionale et nouvelle répartition des compétences.</p><p><a href=\"https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20grandes%20%C3%A9tapes%20de%20la%20d%C3%A9centralisation/\">Source : WikiTerritorial du CNFPT</a></p>"},
 {"id":26,"name":"Loi MAPTAM","subtitle":"Métropoles et action publique territoriale","kind":"point","start":"27/1/2014","end":"","includeStart":true,"includeEnd":true,"tags":["décentralisation","loi","métropoles"],"color":"#A98CC2","html":"<p>La loi n° 2014-58 modernise l’action publique territoriale, rétablit la clause générale de compétence et affirme le fait métropolitain.</p><p><a href=\"https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20grandes%20%C3%A9tapes%20de%20la%20d%C3%A9centralisation/\">Source : WikiTerritorial du CNFPT</a></p>"},
 {"id":27,"name":"Loi relative à la délimitation des régions","subtitle":"Passage à treize régions métropolitaines","kind":"point","start":"16/1/2015","end":"","includeStart":true,"includeEnd":true,"tags":["décentralisation","loi","régions"],"color":"#A98CC2","html":"<p>La loi n° 2015-29 redessine la carte régionale métropolitaine, effective au 1er janvier 2016.</p><p><a href=\"https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20grandes%20%C3%A9tapes%20de%20la%20d%C3%A9centralisation/\">Source : WikiTerritorial du CNFPT</a></p>"},
 {"id":28,"name":"Loi NOTRe","subtitle":"Nouvelle organisation territoriale de la République","kind":"point","start":"7/8/2015","end":"","includeStart":true,"includeEnd":true,"tags":["décentralisation","loi"],"color":"#A98CC2","html":"<p>La loi n° 2015-991 renforce notamment les régions et les intercommunalités et supprime la clause générale de compétence des départements et régions.</p><p><a href=\"https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20grandes%20%C3%A9tapes%20de%20la%20d%C3%A9centralisation/\">Source : WikiTerritorial du CNFPT</a></p>"},
 {"id":29,"name":"Loi 3DS","subtitle":"Différenciation, décentralisation, déconcentration et simplification","kind":"point","start":"21/2/2022","end":"","includeStart":true,"includeEnd":true,"tags":["décentralisation","loi"],"color":"#A98CC2","html":"<p>La loi n° 2022-217 adapte l’action publique aux réalités territoriales et comporte des mesures relatives aux compétences, au logement, aux transports et à la santé.</p><p><a href=\"https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20grandes%20%C3%A9tapes%20de%20la%20d%C3%A9centralisation/\">Source : WikiTerritorial du CNFPT</a></p>"},

 {"id":30,"name":"Lois sociales de Bismarck","subtitle":"Naissance du modèle assurantiel allemand","kind":"period","start":"15/6/1883","end":"22/6/1889","includeStart":true,"includeEnd":true,"tags":["État-providence","période","Allemagne"],"color":"#82A9C7","html":"<p>En Allemagne, Bismarck met en place un système d’assurances sociales obligatoires fondé sur les cotisations : maladie, accidents du travail, invalidité et vieillesse.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source : État-providence — Wikipédia</a></p>"},
 {"id":31,"name":"Assurance maladie obligatoire allemande","subtitle":"Première loi sociale bismarckienne","kind":"point","start":"15/6/1883","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","loi","Allemagne"],"color":"#A98CC2","html":"<p>La loi allemande de 1883 institue une assurance maladie obligatoire pour une partie des ouvriers de l’industrie.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source : État-providence — Wikipédia</a></p>"},
 {"id":32,"name":"Assurance contre les accidents du travail","subtitle":"Deuxième pilier bismarckien","kind":"point","start":"6/7/1884","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","loi","Allemagne"],"color":"#A98CC2","html":"<p>L’Allemagne institue une assurance obligatoire contre les accidents du travail.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source : État-providence — Wikipédia</a></p>"},
 {"id":33,"name":"Assurance invalidité et vieillesse allemande","subtitle":"Achèvement du triptyque bismarckien","kind":"point","start":"22/6/1889","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","loi","Allemagne"],"color":"#A98CC2","html":"<p>Une assurance obligatoire couvre l’invalidité et la vieillesse, complétant le système bismarckien.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source : État-providence — Wikipédia</a></p>"},
 {"id":34,"name":"Assistance médicale gratuite","subtitle":"Première grande assistance nationale en France","kind":"point","start":"15/7/1893","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","loi","France"],"color":"#A98CC2","html":"<p>La loi du 15 juillet 1893 organise l’assistance médicale gratuite au profit des malades privés de ressources.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source générale : État-providence — Wikipédia</a></p>"},
 {"id":35,"name":"Loi sur les accidents du travail","subtitle":"Responsabilité sans preuve de faute","kind":"point","start":"9/4/1898","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","loi","France"],"color":"#A98CC2","html":"<p>La loi du 9 avril 1898 facilite l’indemnisation des salariés victimes d’un accident du travail.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source générale : État-providence — Wikipédia</a></p>"},
 {"id":36,"name":"Retraites ouvrières et paysannes","subtitle":"Premier système obligatoire de retraite en France","kind":"point","start":"5/4/1910","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","loi","retraite","France"],"color":"#A98CC2","html":"<p>La loi du 5 avril 1910 institue les retraites ouvrières et paysannes, système obligatoire mais encore limité.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source générale : État-providence — Wikipédia</a></p>"},
 {"id":37,"name":"Assurances sociales françaises","subtitle":"Maladie, maternité, invalidité, vieillesse et décès","kind":"point","start":"30/4/1930","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","loi","France"],"color":"#A98CC2","html":"<p>Les lois de 1928 et 1930 généralisent un ensemble d’assurances sociales obligatoires pour de nombreux salariés.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source générale : État-providence — Wikipédia</a></p>"},
 {"id":38,"name":"Généralisation des allocations familiales","subtitle":"Obligation d’affiliation des employeurs","kind":"point","start":"11/3/1932","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","loi","famille","France"],"color":"#A98CC2","html":"<p>La loi du 11 mars 1932 oblige les employeurs de l’industrie et du commerce à s’affilier à une caisse de compensation d’allocations familiales.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source générale : État-providence — Wikipédia</a></p>"},
 {"id":39,"name":"Rapport Beveridge","subtitle":"Social Insurance and Allied Services","kind":"point","start":"1942","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","ouvrage","Royaume-Uni"],"color":"#988CC4","html":"<p>William Beveridge propose une protection universelle financée par l’impôt, destinée à combattre les grands risques sociaux.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source : État-providence — Wikipédia</a></p>"},
 {"id":40,"name":"Programme du Conseil national de la Résistance","subtitle":"Les Jours heureux","kind":"point","start":"15/3/1944","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","ouvrage","France"],"color":"#988CC4","html":"<p>Le programme du CNR prévoit notamment un plan complet de sécurité sociale visant à garantir des moyens d’existence à tous.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source : État-providence — Wikipédia</a></p>"},
 {"id":41,"name":"Ordonnances fondatrices de la Sécurité sociale","subtitle":"Organisation du régime général français","kind":"period","start":"4/10/1945","end":"19/10/1945","includeStart":true,"includeEnd":true,"tags":["État-providence","loi","Sécurité sociale","France"],"color":"#7DAE9E","html":"<p>Les ordonnances des 4 et 19 octobre 1945 posent l’architecture de la Sécurité sociale française, combinant inspirations bismarckienne et beveridgienne.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source : État-providence — Wikipédia</a></p>"},
 {"id":42,"name":"Création des comités d’entreprise","subtitle":"Participation et œuvres sociales","kind":"point","start":"22/2/1945","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","loi","travail","France"],"color":"#A98CC2","html":"<p>L’ordonnance du 22 février 1945 crée les comités d’entreprise dans les entreprises dépassant le seuil prévu.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source : État-providence — Wikipédia</a></p>"},
 {"id":43,"name":"Création du SMIG","subtitle":"Salaire minimum interprofessionnel garanti","kind":"point","start":"11/2/1950","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","loi","travail","France"],"color":"#A98CC2","html":"<p>La loi du 11 février 1950 permet l’instauration du SMIG, ancêtre du SMIC.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source : État-providence — Wikipédia</a></p>"},
 {"id":44,"name":"Troisième semaine de congés payés","subtitle":"Extension du repos annuel","kind":"point","start":"27/3/1956","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","loi","travail","France"],"color":"#A98CC2","html":"<p>La loi du 27 mars 1956 porte la durée légale des congés payés à trois semaines.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source : État-providence — Wikipédia</a></p>"},
 {"id":45,"name":"Création de l’assurance chômage","subtitle":"Convention nationale interprofessionnelle","kind":"point","start":"31/12/1958","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","fait majeur","chômage","France"],"color":"#7DAE9E","html":"<p>La convention du 31 décembre 1958 crée un régime national interprofessionnel d’assurance chômage, géré par l’Unédic et les Assédic.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source : État-providence — Wikipédia</a></p>"},
 {"id":46,"name":"Cinquième semaine de congés payés","subtitle":"Ordonnance de 1982","kind":"point","start":"16/1/1982","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","loi","travail","France"],"color":"#A98CC2","html":"<p>L’ordonnance n° 82-41 généralise la cinquième semaine de congés payés.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source : État-providence — Wikipédia</a></p>"},
 {"id":47,"name":"Retraite à 60 ans","subtitle":"Ordonnance de 1982","kind":"point","start":"26/3/1982","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","loi","retraite","France"],"color":"#A98CC2","html":"<p>L’ordonnance n° 82-270 ouvre sous conditions la retraite à taux plein à 60 ans.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source : État-providence — Wikipédia</a></p>"},
 {"id":48,"name":"Création du RMI","subtitle":"Revenu minimum d’insertion","kind":"point","start":"1/12/1988","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","loi","minimum social","France"],"color":"#7DAE9E","html":"<p>La loi n° 88-1088 crée un revenu minimum assorti d’un dispositif d’insertion.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source : État-providence — Wikipédia</a></p>"},
 {"id":49,"name":"Création de la CMU","subtitle":"Couverture maladie universelle","kind":"point","start":"27/7/1999","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","loi","santé","France"],"color":"#7DAE9E","html":"<p>La loi n° 99-641 crée la couverture maladie universelle et sa couverture complémentaire sous condition de ressources.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source : État-providence — Wikipédia</a></p>"},
 {"id":50,"name":"Création du RSA","subtitle":"Revenu de solidarité active","kind":"point","start":"1/12/2008","end":"","includeStart":true,"includeEnd":true,"tags":["État-providence","loi","minimum social","France"],"color":"#7DAE9E","html":"<p>La loi n° 2008-1249 généralise le RSA, qui remplace notamment le RMI à compter de 2009.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source : État-providence — Wikipédia</a></p>"},
 {"id":51,"name":"Consolidation de l’État social français","subtitle":"De la Libération au tournant des années 1970","kind":"period","start":"1945","end":"1975","includeStart":true,"includeEnd":true,"tags":["État-providence","période","France"],"color":"#82A9C7","html":"<p>Extension progressive de la couverture sociale, des droits du travail et des services publics pendant les décennies d’après-guerre.</p><p><a href=\"https://fr.wikipedia.org/wiki/%C3%89tat-providence\">Source générale : État-providence — Wikipédia</a></p>"},

 {"id":52,"name":"Révolution française","subtitle":"De la réunion des États généraux au 18 Brumaire","kind":"period","start":"5/5/1789","end":"9/11/1799","includeStart":true,"includeEnd":true,"tags":["Révolution française","période"],"color":"#82A9C7","html":"<p>Période de rupture politique et sociale qui conduit de la monarchie d’Ancien Régime au Consulat.</p><p><a href=\"https://fr.wikipedia.org/wiki/Chronologie_de_la_R%C3%A9volution_fran%C3%A7aise\">Source : Chronologie de la Révolution française — Wikipédia</a></p>"},
 {"id":53,"name":"Assemblée nationale constituante","subtitle":"Élaboration de la Constitution de 1791","kind":"period","start":"17/6/1789","end":"30/9/1791","includeStart":true,"includeEnd":true,"tags":["Révolution française","période","institution"],"color":"#82A9C7","html":"<p>La Constituante abolit les privilèges, adopte la Déclaration des droits de l’homme et du citoyen et prépare la Constitution de 1791.</p><p><a href=\"https://fr.wikipedia.org/wiki/Chronologie_de_la_R%C3%A9volution_fran%C3%A7aise\">Source : Wikipédia</a></p>"},
 {"id":54,"name":"Assemblée nationale législative","subtitle":"Monarchie constitutionnelle","kind":"period","start":"1/10/1791","end":"20/9/1792","includeStart":true,"includeEnd":true,"tags":["Révolution française","période","institution"],"color":"#82A9C7","html":"<p>Première assemblée élue sous la Constitution de 1791 ; elle siège jusqu’à l’entrée en fonction de la Convention nationale.</p><p><a href=\"https://fr.wikipedia.org/wiki/Chronologie_de_la_R%C3%A9volution_fran%C3%A7aise\">Source : Wikipédia</a></p>"},
 {"id":55,"name":"Convention nationale","subtitle":"Première République","kind":"period","start":"21/9/1792","end":"26/10/1795","includeStart":true,"includeEnd":true,"tags":["Révolution française","période","institution"],"color":"#82A9C7","html":"<p>La Convention abolit la royauté, gouverne pendant la guerre et la Terreur, puis prépare le régime du Directoire.</p><p><a href=\"https://fr.wikipedia.org/wiki/Chronologie_de_la_R%C3%A9volution_fran%C3%A7aise\">Source : Wikipédia</a></p>"},
 {"id":56,"name":"Terreur","subtitle":"Gouvernement révolutionnaire d’exception","kind":"period","start":"5/9/1793","end":"28/7/1794","includeStart":true,"includeEnd":true,"tags":["Révolution française","période"],"color":"#C79AA8","html":"<p>La mise de « la Terreur à l’ordre du jour » ouvre conventionnellement cette phase, close par l’exécution de Robespierre et de ses alliés le 10 Thermidor.</p><p><a href=\"https://fr.wikipedia.org/wiki/Chronologie_de_la_R%C3%A9volution_fran%C3%A7aise\">Source : Wikipédia</a></p>"},
 {"id":57,"name":"Directoire","subtitle":"Constitution de l’an III","kind":"period","start":"26/10/1795","end":"9/11/1799","includeStart":true,"includeEnd":true,"tags":["Révolution française","période","institution"],"color":"#82A9C7","html":"<p>Régime républicain à exécutif collégial renversé par le coup d’État du 18 Brumaire.</p><p><a href=\"https://fr.wikipedia.org/wiki/Chronologie_de_la_R%C3%A9volution_fran%C3%A7aise\">Source : Wikipédia</a></p>"},
 {"id":58,"name":"Ouverture des États généraux","subtitle":"Versailles","kind":"point","start":"5/5/1789","end":"","includeStart":true,"includeEnd":true,"tags":["Révolution française","événement majeur"],"color":"#D58F8F","html":"<p>Les États généraux s’ouvrent à Versailles dans la salle des Menus-Plaisirs.</p><p><a href=\"https://fr.wikipedia.org/wiki/Chronologie_de_la_R%C3%A9volution_fran%C3%A7aise\">Source : Wikipédia</a></p>"},
 {"id":59,"name":"Proclamation de l’Assemblée nationale","subtitle":"Le tiers état revendique la souveraineté nationale","kind":"point","start":"17/6/1789","end":"","includeStart":true,"includeEnd":true,"tags":["Révolution française","événement majeur"],"color":"#D58F8F","html":"<p>Les députés du tiers état, rejoints par certains membres du clergé, se proclament Assemblée nationale.</p><p><a href=\"https://fr.wikipedia.org/wiki/Chronologie_de_la_R%C3%A9volution_fran%C3%A7aise\">Source : Wikipédia</a></p>"},
 {"id":60,"name":"Serment du Jeu de paume","subtitle":"Ne pas se séparer avant d’avoir donné une Constitution","kind":"point","start":"20/6/1789","end":"","includeStart":true,"includeEnd":true,"tags":["Révolution française","événement majeur"],"color":"#D58F8F","html":"<p>Les députés jurent de ne pas se séparer avant d’avoir établi une Constitution.</p><p><a href=\"https://fr.wikipedia.org/wiki/Chronologie_de_la_R%C3%A9volution_fran%C3%A7aise\">Source : Wikipédia</a></p>"},
 {"id":61,"name":"Prise de la Bastille","subtitle":"Insurrection parisienne","kind":"point","start":"14/7/1789","end":"","includeStart":true,"includeEnd":true,"tags":["Révolution française","événement majeur"],"color":"#D58F8F","html":"<p>La foule parisienne s’empare de la forteresse de la Bastille.</p><p><a href=\"https://fr.wikipedia.org/wiki/Chronologie_de_la_R%C3%A9volution_fran%C3%A7aise\">Source : Wikipédia</a></p>"},
 {"id":62,"name":"Abolition des privilèges","subtitle":"Nuit du 4 août","kind":"point","start":"4/8/1789","end":"","includeStart":true,"includeEnd":true,"tags":["Révolution française","loi","événement majeur"],"color":"#A98CC2","html":"<p>L’Assemblée nationale abolit les privilèges et les droits féodaux, selon des modalités précisées par les décrets suivants.</p><p><a href=\"https://fr.wikipedia.org/wiki/Chronologie_de_la_R%C3%A9volution_fran%C3%A7aise\">Source : Wikipédia</a></p>"},
 {"id":63,"name":"Déclaration des droits de l’homme et du citoyen","subtitle":"Texte fondateur","kind":"point","start":"26/8/1789","end":"","includeStart":true,"includeEnd":true,"tags":["Révolution française","ouvrage","droits fondamentaux"],"color":"#988CC4","html":"<p>L’Assemblée adopte la Déclaration des droits de l’homme et du citoyen.</p><p><a href=\"https://fr.wikipedia.org/wiki/Chronologie_de_la_R%C3%A9volution_fran%C3%A7aise\">Source : Wikipédia</a></p>"},
 {"id":64,"name":"Journées d’octobre","subtitle":"Marche sur Versailles et retour du roi à Paris","kind":"period","start":"5/10/1789","end":"6/10/1789","includeStart":true,"includeEnd":true,"tags":["Révolution française","événement majeur"],"color":"#D58F8F","html":"<p>Des Parisiennes et la Garde nationale marchent sur Versailles ; la famille royale est ramenée à Paris.</p><p><a href=\"https://fr.wikipedia.org/wiki/Chronologie_de_la_R%C3%A9volution_fran%C3%A7aise\">Source : Wikipédia</a></p>"},

const defs='<defs>'+periods.map((e,i)=>'<pattern id="h'+e.id+'" width="'+(7+i%3*2)+'" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate('+(i%2?45:-45)+')"><path d="M 0 0 V 8" stroke="'+e.color+'" stroke-width="2" opacity=".65"/></pattern>').join("")+'</defs>';canvas.style.height=height+"px";canvas.insertAdjacentHTML("afterbegin",'<svg width="'+width+'" height="'+height+'" viewBox="0 0 '+width+' '+height+'" aria-hidden="true">'+defs+axis+bands+lines+marks+'</svg>'+ticks+axisDates)}
function openEditor(e){editedId=e?.id??null;$("formTitle").textContent=e?"Modifier l’événement":"Nouvel événement";$("name").value=e?.name||"";$("subtitle").value=e?.subtitle||"";$("kind").value=e?.kind||"point";$("start").value=e?.start||"";$("end").value=e?.end||"";$("tags").value=e?.tags.join(", ")||"";$("includeStart").checked=e?.includeStart??true;$("includeEnd").checked=e?.includeEnd??true;$("description").innerHTML=clean(e?.html||"");setColor(e?.color||"#315EB6");$("error").textContent="";$("delete").hidden=!e;updateKind();closeDetail();$("scrim").hidden=false;$("editor").hidden=false;$("name").focus()}
function closeEditor(){$("editor").hidden=true;$("scrim").hidden=true;$("colorPanel").hidden=true}
function updateKind(){const p=$("kind").value==="period";$("endLabel").hidden=!p;$("periodOptions").hidden=!p}
$("editor").onsubmit=ev=>{ev.preventDefault();try{const e={id:editedId||Math.max(0,...rows.map(e=>e.id))+1,name:$("name").value.trim(),subtitle:$("subtitle").value.trim(),kind:$("kind").value,start:$("start").value.trim(),end:$("kind").value==="period"?$("end").value.trim():"",includeStart:$("includeStart").checked,includeEnd:$("includeEnd").checked,tags:[...new Set($("tags").value.split(",").map(t=>t.trim()).filter(Boolean))],color:validColor($("colorCode").value),html:clean($("description").innerHTML)};validate([e]);const i=rows.findIndex(r=>r.id===editedId);i<0?rows.push(e):rows[i]=e;closeEditor();filters.clear();save();render()}catch(e){$("error").textContent=e.message}}
$("delete").onclick=()=>{if(!editedId||!confirm("Supprimer définitivement cet événement du brouillon ?"))return;rows=rows.filter(e=>e.id!==editedId);closeEditor();filters.clear();save();render()};$("cancel").onclick=closeEditor;$("scrim").onclick=closeEditor;$("kind").onchange=updateKind;$("add").onclick=()=>openEditor();$("modifyDetail").onclick=()=>openEditor(rows.find(e=>e.id===detailId));$("closeDetail").onclick=closeDetail;$("detail").onmouseenter=()=>clearTimeout(hoverTimer);$("detail").onmouseleave=scheduleClose;
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("editor").hidden?closeDetail():closeEditor()}});$("timelineButton").onclick=()=>{view="timeline";render()};$("tableButton").onclick=()=>{view="table";render()};$("direction").onchange=render;$("toggleFilters").onclick=()=>{const open=$("filters").hidden;$("filters").hidden=!open;$("toggleFilters").setAttribute("aria-expanded",String(open))};function changeZoom(delta){const old=zoom;zoom=Math.max(1,Math.min(3,Math.round((zoom+delta)*4)/4));$("zoomOut").disabled=zoom===1;$("zoomIn").disabled=zoom===3;if(zoom!==old){render();notice(zoom>=1.35?"Les dates assez espacées apparaissent maintenant sur la frise.":"")}}$("zoomOut").onclick=()=>changeZoom(-.25);$("zoomIn").onclick=()=>changeZoom(.25);$("zoomOut").disabled=true;
document.querySelectorAll("[data-command]").forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{$("description").focus();document.execCommand(b.dataset.command,false,null)}});$("link").onmousedown=e=>e.preventDefault();$("link").onclick=()=>{const u=prompt("Adresse du lien : https://…");if(u&&/^https?:\/\//i.test(u)){$("description").focus();document.execCommand("createLink",false,u)}};$("image").onchange=()=>{const f=$("image").files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>700000){$("error").textContent="Choisis un PNG, JPEG ou WebP de moins de 700 ko.";return}const r=new FileReader;r.onload=()=>{const img=document.createElement("img");img.src=r.result;img.alt="Illustration";$("description").append(img);$("image").value=""};r.readAsDataURL(f)};
function setColor(c){c=validColor(c);$("colorCode").value=c;$("colorChip").style.setProperty("--chosen",c)}$("colorCode").oninput=()=>{if(/^#[0-9a-f]{6}$/i.test($("colorCode").value))setColor($("colorCode").value)};$("openColor").onclick=()=>{$("colorPanel").hidden=!$("colorPanel").hidden;if(!$("colorPanel").hidden)drawWheel()};const presets=["#315EB6","#14847A","#D8792D","#C94F59","#8A55A7","#D49A00","#3E7C45","#64748B"];$("swatches").innerHTML=presets.map(c=>'<button type="button" style="--swatch:'+c+'" data-color="'+c+'" aria-label="Choisir '+c+'"></button>').join("");$("swatches").querySelectorAll("button").forEach(b=>b.onclick=()=>setColor(b.dataset.color));
const wheel=$("colorWheel"),ctx=wheel.getContext("2d");function hsl(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[f(0),f(8),f(4)].map(x=>Math.round(255*x))}function hex(rgb){return"#"+rgb.map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase()}function drawWheel(){const size=wheel.width,c=size/2,r=c-8,img=ctx.createImageData(size,size),light=+$("brightness").value;for(let y=0;y<size;y++)for(let x=0;x<size;x++){const dx=x-c,dy=y-c,d=Math.hypot(dx,dy),i=(y*size+x)*4;if(d<=r){const hue=(Math.atan2(dy,dx)*180/Math.PI+360)%360,sat=Math.min(100,d/r*100),rgb=hsl(hue,sat,light);img.data[i]=rgb[0];img.data[i+1]=rgb[1];img.data[i+2]=rgb[2];img.data[i+3]=255}}ctx.putImageData(img,0,0)}function pickColor(ev){const r=wheel.getBoundingClientRect(),x=(ev.clientX-r.left)*wheel.width/r.width-wheel.width/2,y=(ev.clientY-r.top)*wheel.height/r.height-wheel.height/2,rad=wheel.width/2-8,d=Math.min(rad,Math.hypot(x,y)),h=(Math.atan2(y,x)*180/Math.PI+360)%360;setColor(hex(hsl(h,d/rad*100,+$("brightness").value)))}wheel.onpointerdown=e=>{wheel.setPointerCapture(e.pointerId);pickColor(e)};wheel.onpointermove=e=>{if(e.buttons)pickColor(e)};$("brightness").oninput=drawWheel;
const csvHeaders=["id","name","subtitle","kind","start","end","includeStart","includeEnd","tags","color","html"];
function csvCell(value){const s=String(value??"");return/[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function makeCsv(){const lines=[csvHeaders.join(",")];for(const e of rows)lines.push(csvHeaders.map(k=>csvCell(k==="tags"?JSON.stringify(e.tags):e[k])).join(","));return"\ufeff"+lines.join("\r\n")}
function readCsv(text){text=String(text).replace(/^\ufeff/,"");const table=[];let row=[],cell="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===","){row.push(cell);cell=""}else if(c==="\n"){row.push(cell.replace(/\r$/,"").trimEnd());table.push(row);row=[];cell=""}else cell+=c}if(quoted)throw Error("Guillemet non fermé dans le CSV.");if(cell||row.length){row.push(cell.replace(/\r$/,"").trimEnd());table.push(row)}if(!table.length)throw Error("Le fichier CSV est vide.");const headers=table.shift().map(x=>x.trim()),positions=Object.fromEntries(headers.map((h,i)=>[h,i]));for(const key of csvHeaders)if(!(key in positions))throw Error("Colonne manquante : "+key);const data=table.filter(r=>r.some(Boolean)).map(r=>{let tags;try{tags=JSON.parse(r[positions.tags]||"[]")}catch{tags=String(r[positions.tags]||"").split("|").map(x=>x.trim()).filter(Boolean)}return{id:Number(r[positions.id]),name:r[positions.name],subtitle:r[positions.subtitle],kind:r[positions.kind],start:r[positions.start],end:r[positions.end],includeStart:String(r[positions.includeStart]).toLowerCase()==="true",includeEnd:String(r[positions.includeEnd]).toLowerCase()==="true",tags,color:r[positions.color],html:r[positions.html]}});return validate(data)}
$("exportCsv").onclick=()=>{const blob=new Blob([makeCsv()],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a"),stamp=new Date().toISOString().slice(0,10);a.href=url;a.download="frise-"+stamp+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);notice("CSV exporté : il peut être réimporté dans une autre copie du site.")};
$("importCsv").onchange=async()=>{const file=$("importCsv").files[0];if(!file)return;try{const imported=readCsv(await file.text());if(!imported.length)throw Error("Le CSV ne contient aucun événement.");if(!confirm("Remplacer la frise actuelle par les "+imported.length+" événements de ce fichier ?"))return;rows=imported;filters.clear();save();render();notice(imported.length+" événements importés.")}catch(e){notice("Import impossible : "+e.message)}finally{$("importCsv").value=""}};
let resizeTimer;addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>view==="timeline"&&render(),150)});load();try{rows=validate(rows);render()}catch(e){notice("Erreur dans les données : "+e.message)}
