name: palette-temporaire

on:
  push:
    paths:
      - .github/workflows/add-temporary-palette.yml
      - .github/patch_palette.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: python .github/patch_palette.py
      - name: Check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,flags=re.S)
          js='\n'.join(b for b in blocks if '(()=>{"use strict"' in b)
          Path('/tmp/frise-check.js').write_text(js)
          PY
          node --check /tmp/frise-check.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Ajouter une palette de couleurs temporaire"
          git push
