}
function updatePointLayers(){if(currentMode>1)return;var z=map.getZoom();if(selectedUnit){var g=groupItems(currentItems()).find(function(v){return String(v.key)===String(selectedUnit)});if(g&&z>=(currentMode===0?9:8)){bubbleLayer.clearLayers();addPins(g.items);return}}if(z<=(currentMode===0?7.7:6.7))nationalBubbles()}
function featureCount(feature,key){var code=String((feature.properties||{}).code||"");return key==="region"?(countBy("region")[code]||0):(countBy("dept")[code]||0)}
function fillFor(n){if(n>=5)return"#173f86";if(n>=3)return"#315eb6";if(n>=2)return"#6d91d3";if(n>=1)return"#b7c9e9";return"#e8edf4"}
function loadAdmin(which){
bubbleLayer.clearLayers();pinLayer.clearLayers();focusLayer.clearLayers();adminLayer.clearLayers();selectedUnit=null;$("unitCard").hidden=true;clearDetail();
var key=which==="region"?"region":"departement";if(geoCache[key]){drawAdmin(geoCache[key],key);return}
$("loading").hidden=false;
var url=which==="region"?"https://geo.api.gouv.fr/regions?fields=code,nom&format=geojson&geometry=contour":"https://geo.api.gouv.fr/departements?fields=code,nom&format=geojson&geometry=contour";
fetch(url).then(function(r){if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(function(j){geoCache[key]=j;drawAdmin(j,key)}).catch(function(){fallbackAdmin(key)}).finally(function(){$("loading").hidden=true})
}
function drawAdmin(geo,key){
adminLayer.clearLayers();
adminLayer=L.geoJSON(geo,{style:function(feature){var n=featureCount(feature,key);return{color:"#fff",weight:1.25,fillColor:fillFor(n),fillOpacity:.82}},onEachFeature:function(feature,layer){
var n=featureCount(feature,key),name=feature.properties.nom,code=String(feature.properties.code);
layer.bindTooltip(name+" · "+n+" exemple"+(n>1?"s":""),{sticky:true,className:"unit-tooltip"});
layer.on("mouseover",function(){layer.setStyle({weight:3,color:"#182334",fillOpacity:.95});layer.bringToFront()});
layer.on("mouseout",function(){adminLayer.resetStyle(layer)});
layer.on("click",function(){selectedUnit=code;$("unitName").textContent=name;$("unitInfo").textContent=n?n+" exemple"+(n>1?"s":"")+" fictif"+(n>1?"s":"")+" · épingles affichées":"Aucun exemple fictif dans ce prototype";$("unitCard").hidden=false;if(layer.getBounds)map.fitBounds(layer.getBounds(),{padding:[45,45],maxZoom:key==="region"?7:9});var list=currentItems().filter(function(x){return String(x.unitCode||"")===code});addPins(list)})
}}).addTo(map)
}
function fallbackAdmin(key){adminLayer.clearLayers();groupItems(currentItems()).forEach(function(g){L.circle(g.center,{radius:key==="region"?85000:42000,color:"#fff",weight:2,fillColor:fillFor(g.count),fillOpacity:.85}).addTo(adminLayer).bindTooltip(g.name+" · "+g.count,{className:"unit-tooltip"}).on("click",function(){map.flyTo(g.center,key==="region"?7:9);addPins(g.items)})})}
function renderMode(){var m=current();$("modeTitle").textContent=m.title;$("modeHelp").textContent=m.help;document.querySelectorAll("[data-mode]").forEach(function(b){b.classList.toggle("active",Number(b.dataset.mode)===currentMode)});clearDetail();$("unitCard").hidden=true;selectedUnit=null;if(m.key==="region"||m.key==="departement")loadAdmin(m.key);else nationalBubbles()}
function setMode(n){currentMode=Math.max(0,Math.min(3,Number(n)||0));$("modeRange").value=String(currentMode);renderMode()}
$("modeRange").addEventListener("input",function(){setMode(this.value)});
document.querySelectorAll("[data-mode]").forEach(function(b){b.addEventListener("click",function(){setMode(this.dataset.mode)})});
document.querySelectorAll("[data-overseas]").forEach(function(b){b.addEventListener("click",function(){var v=overseasViews[this.dataset.overseas];if(v)map.flyTo(v.center,v.zoom,{duration:.65})})});
$("closeDetail").onclick=clearDetail;
map.on("zoomend moveend",updatePointLayers);
renderMode();
})();
</script>
</body></html>
